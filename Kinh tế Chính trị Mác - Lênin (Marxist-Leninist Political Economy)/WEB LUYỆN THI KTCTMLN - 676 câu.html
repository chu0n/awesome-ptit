erId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291248`,sourceQuestionNumber:33,type:`Điền khuyết`,difficulty:`Nhận biết`,prompt:`Điền từ ngữ thích hợp vào chỗ chấm:

đóng vai trò là`,options:[`lực lượng sản xuất trực tiếp.`,`lực lượng sản xuất gián tiếp.`,`quan hệ sản xuất đặc trưng.`,`quan hệ sản xuất thứ yếu.`],answer:0,explanation:``,tags:[`Nhận diện nhân vật/địa điểm`,`Thông hiểu`,`Câu 35`,`ID 231291250`]},{id:`c6-231291251`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291251`,sourceQuestionNumber:36,type:`Đặc trưng/nội dung`,difficulty:`Thông hiểu`,prompt:`Nội dung nào dưới đây là đặc điểm chủ yếu của nền kinh tế tri thức?`,options:[`Các ngành kinh tế thủ công, dựa vào sức lao động của con người là chính, ngày càng tăng và chiếm đa số.`,`Tri thức trở thành lực lưọng sản xuất trực tiếp, là nguồn lực quan trọng hàng đầu, quyếtđịnh sự tăng trưởng - phát triển kinh tế.`,`Học tập trở thành yêu cầu thường xuyên đối với mọi người và phát triển công nghiệp nặng trở thành nhiệm vụ trung tâm của xã hội.`,`Trí tuệ nhân tạo được úng dụng rộng rãi trong mọi lĩnh vực và thiết lậpđược các mạng thông tin đa phương tiện phủ khắp nước.`],answer:2,explanation:``,tags:[`Đặc trưng/nội dung`,`Thông hiểu`,`Câu 36`,`ID 231291251`]},{id:`c6-231291252`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291252`,sourceQuestionNumber:37,type:`Nhận diện bẫy`,difficulty:`Thông hiểu`,prompt:`Nội dung nào dưới đây không phải là đặc điểm chủ yếu của nền kinh tế tri thức?`,options:[`Công nghệ thông tin được ứng dụng rộng rãi trong mọi lĩnh vực và thiết lập được các mạng thông tin đa phương tiện phủ khắp nước.`,`Học tập trở thành yêu cầu thường xuyên đối với mọi người và phát triển con nguời trở thành nhiệm vụ trung tâm của xã hội.`,`Các ngành kinh tế dựa vào tri thức, dựa vào các thành tựu mới nhất của khoa học và công nghệ ngày càng tăng và chiếm đa số.`,`Các ngành kinh tế thủ công, dựa vào sức lao động của con người là chính ngày càngtăng và chiếm đa số.`],answer:3,explanation:``,tags:[`Nhận diện bẫy`,`Thông hiểu`,`Câu 37`,`ID 231291252`]},{id:`c6-231291253`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291253`,sourceQuestionNumber:38,type:`Đặc trưng/nội dung`,difficulty:`Thông hiểu`,prompt:`Nội dung của công nghiệp hoá, hiện đại hoá ở Việt Nam là`,options:[`tạo lập những điều kiện và thực hiện các nhiệm vụ để chuyển đổi nền sản xuất - xã hộilạc hậu sang nền sản xuất - xã hội hiện đại.`,`tăng cường nhận viện trợ và thực hiện các nhiệm vụ để chuyển đổi nền sản xuất - xã hội lạc hậu sang nền sản xuất - xã hội hiện đại.`,`tạo lập những điều kiện trong nước và và tăng cưòng nhận viện trợ nước ngoài để chuyển đổi nền sản xuất - xã hội lạc hậu sang nền sản xuất – xã hội hiện đại.`,`tăng cường hợp tác, đầu tư quốc tế, từng bước hoàn thiện lực lượng sản xuất phù hợp với trình độ phát triển của quan hệ sản xuất.`],answer:0,explanation:``,tags:[`Đặc trưng/nội dung`,`Thông hiểu`,`Câu 38`,`ID 231291253`]},{id:`c6-231291254`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291254`,sourceQuestionNumber:39,type:`Nhận diện bẫy`,difficulty:`Thông hiểu`,prompt:`Nhiệm vụ nào dưới đây không phải là nhiệm vụ cần thực hiện để chuyển đổi nền sản xuất - xã hội lạc hậu sang nền sản xuất - xã hội hiệnđại ở nuớc ta?`,options:[`Đẩy mạnh ứng dụng những thành tựu của khoa học - công nghệ mới hiện đại.`,`Chuyển dịch cơ cấu kinh tế theo hướng hiện đại, hợp lí và hiệu quà.`,`Từng buớc hoàn thiện lực lượng sản xuất phù hợp với trình độ phát triển của quan hệsản xuất.`,`Sẵn sàng thích ứng với tác đông của bối cảnh cuộc Cách mạng công nghiệp lần thứ tư.`],answer:3,explanation:``,tags:[`Nhận diện bẫy`,`Thông hiểu`,`Câu 39`,`ID 231291254`]},{id:`c6-231291255`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291255`,sourceQuestionNumber:40,type:`Khái niệm`,difficulty:`Nhận biết`,prompt:`Mối quan hệ tỉ lệ giữa các ngành, các vùng và các thành phần kinh tế là nội dung của khái niệm nào?`,options:[`Phát triển kinh tế`,`Cơ cấu kinh tế`,`Thành phần kinh tế`,`Tăng trưởng kinh tế`],answer:1,explanation:``,tags:[`Khái niệm`,`Nhận biết`,`Câu 40`,`ID 231291255`]},{id:`c6-231291256`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291256`,sourceQuestionNumber:41,type:`Trắc nghiệm lý thuyết`,difficulty:`Nhận biết`,prompt:`Cơ cấu kinh tế bao gồm`,options:[`Cơ cấu ngành, cơ cấu vùng và cơ cấu nguồn lực kinh tế`,`Cơ cấu ngành, cơ cấu nguồn lực, cơ cấu thành phần kinh tế`,`Cơ cấu ngành, cơ cấu vùng và cơ cấu thành phân kinh tế`,`Cơ cấu nguồn lực, cơ cấu vùng và cơ cấu thành phần kinh tế`],answer:2,explanation:``,tags:[`Trắc nghiệm lý thuyết`,`Nhận biết`,`Câu 41`,`ID 231291256`]},{id:`c6-231291257`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291257`,sourceQuestionNumber:42,type:`Trắc nghiệm lý thuyết`,difficulty:`Nhận biết`,prompt:`Trong hệ thống cơ cấu kinh tế, cơ cấu giữ vị trí quan trọng nhất là`,options:[`Cơ cấu ngành kinh tế`,`Cơ cấu vùng kinh tế`,`Cơ cấu nguồn lực kinh tế`,`Cơ cấu thành phần kinh tế`],answer:0,explanation:``,tags:[`Trắc nghiệm lý thuyết`,`Nhận biết`,`Câu 42`,`ID 231291257`]},{id:`c6-231291258`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291258`,sourceQuestionNumber:43,type:`Trắc nghiệm lý thuyết`,difficulty:`Nhận biết`,prompt:`Chuyển dịch cơ cấu ngành kinh tế theo hướng nào dưới đây được coi là hiện đại hiệu quả?`,options:[`Tăng tỉ trọng ngành kinh tế và dịch vụ, giảm tỉ trọng ngành công nghiệp`,`Tăng tỉ trọng ngành công nghiệp và dịch vụ, giảm tỉ trọng ngành nông nghiệp`,`Tăng tỉ trọng ngành dịch vụ, giảm tỉ trọng ngành công nghiệp và nông nghiệp`,`Tăng tỉ trọng ngành nông nghiệp, giảm tỉ trọng ngành công nghiệp và dịch vụ`],answer:1,explanation:``,tags:[`Trắc nghiệm lý thuyết`,`Nhận biết`,`Câu 43`,`ID 231291258`]},{id:`c6-231291259`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291259`,sourceQuestionNumber:44,type:`Nhận diện bẫy`,difficulty:`Thông hiểu`,prompt:`Nội dung nào dưới đây không phải là yêu cầu cần đáp ứng của một cơ cấu kinh tế hợp lý, hiện đại và hiệu quả?`,options:[`Khai thác, phân bổ và phát huy hiệu quả các nguồn lực trong nước, thu hút có hiệu quả các nguồn lực bên ngoài để phát triển kinh tế - xã hội`,`Phù hợp với cơ cấu kinh tế của tất cả các nước tiên tiến, hiện đại, có nền kinh tế phát triển cao trên thế giới`,`Cho phép ứng dụng những thành tựu khoa học – công nghệ mới, hiện đại và các ngành, các vùng, và các lĩnh vực của nền kinh tế`,`Phù hợp với xu thế phát triển chung của nền kinh tế và yêu cầu của toàn cầu hóa và hội nhập quốc tế`],answer:1,explanation:``,tags:[`Nhận diện bẫy`,`Thông hiểu`,`Câu 44`,`ID 231291259`]},{id:`c6-231291260`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291260`,sourceQuestionNumber:45,type:`Đặc trưng/nội dung`,difficulty:`Thông hiểu`,prompt:`Một trong những nội dung chủ yếu mà công nghiệp hóa, hiện đại hóa ở Việt Nam cần thực hiện để thích ứng với các tác động của cuộc Cách mạng Công nghiệp lần thứ IV là`,options:[`Duy trì, củng cố khung pháp lý hiện tại để khẳng định vai trò quan trọng của Nhà nước về kinh tế`,`Hoàn thiện thể chế, xây dựng nền kinh tế dựa trên nền tảng đổi mới, sáng tạo`,`Hạn chế tối đa các nguồn lực của Nhà nước, của toàn dân để phục vụ cho nghiên cứu, triển khai, ứng dụng các thành tựu của cách mạng nông nghiệp`,`Tập trung chủ yếu việc huy động, khai thác nguồn lực nước ngoài để phát triển nhanh chóng hạ tầng công nghệ thông tin và truyền thông`],answer:1,explanation:``,tags:[`Đặc trưng/nội dung`,`Thông hiểu`,`Câu 45`,`ID 231291260`]},{id:`c6-231291261`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291261`,sourceQuestionNumber:46,type:`Trắc nghiệm lý thuyết`,difficulty:`Nhận biết`,prompt:`Cơ cấu ngành kinh tế giữ vị trí quan trọng nhất trong hệ thống cơ cấu kinh tế vì`,options:[`Phản ánh trình độ phát triển của nền kinh tế và kết quả của quá trình thực hiện công nghiệp hóa, hiện đại hóa`,`Là biểu hiện duy nhất của cơ cấu kinh tế và là thước đo kết quả của quá trình thực hiện công nghiệp hóa, hiện đại hóa`,`Tập trung mọi nguồn lực nền kinh tế và quyết định kết quả của quá trình thực hiện công nghiệp hóa, hiện đại hóa`,`Không bị ảnh hưởng bởi các cơ cấu kinh tế khác và quyết định kết quả của quá trình thực hiện công nghiệp hóa, hiện đại hóa`],answer:0,explanation:``,tags:[`Trắc nghiệm lý thuyết`,`Nhận biết`,`Câu 46`,`ID 231291261`]},{id:`c6-231291262`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291262`,sourceQuestionNumber:47,type:`Nhận diện bẫy`,difficulty:`Thông hiểu`,prompt:`Nhiệm vụ nào dưới đây không phải là nhiệm vụ mà công nghiệp hóa, hiện đại hóa ở nước ta cần thực hiện để ứng phó với những tác động tiêu cực của cuộc Cách mạng Công nghiệp lần thứ IV ?`,options:[`Huy động tối đa các nguồn vốn viện trợ từ nước ngoài`,`Thực hiện chuyển đổi số nền kinh tế và quản trị xã hội`,`Đẩy mạnh công nghiệp hóa, hiện đại hóa nông nghiệp, nông thôn`,`Phát triển nguồn nhân lực đặc biệt là nguồn nhân lực chất lượng cao`],answer:0,explanation:``,tags:[`Nhận diện bẫy`,`Thông hiểu`,`Câu 47`,`ID 231291262`]},{id:`c6-231291263`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291263`,sourceQuestionNumber:48,type:`Nhận diện nhân vật/địa điểm`,difficulty:`Thông hiểu`,prompt:`Nội dung nào có vai trò đặc biệt quan trọng trong quá trình thực hiện công nghiệp hóa, hiện đại hóa ở Việt Nam để thích ứng với tác động của cuộc Cách mạng công nghiệp lần thứ tư ?`,options:[`Phát hiện phát triển nguồn nhân lực đặc biệt là nguồn nhân lực chất lượng cao`,`Thực hiện chuyển đổi số nền kinh tế và quản trị xã hội`,`Xây dụng và phát triển hạ tầng kĩ thuật về công nghệ thông tin vàtruyên thông`,`Đẩy mạnh công nghiệp hoá, hiện đại hoá nông nghiêp,nông thôn`],answer:0,explanation:``,tags:[`Nhận diện nhân vật/địa điểm`,`Thông hiểu`,`Câu 48`,`ID 231291263`]},{id:`c6-231291264`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291264`,sourceQuestionNumber:49,type:`Trắc nghiệm lý thuyết`,difficulty:`Nhận biết`,prompt:`Một trong những giải pháp cơ bản nước ta cần thực hiện để nâng cao trình độ đảo tạo, sử dụng nhân lực, nhân tài là`,options:[`đổi mới mạnh mẽ và đồng bộ lĩnh vực giáo dục - đào tạo theo hưóng coi trọng chất lượng, hiệu quả và coi trọng trang bị nội dung kiến thức chongười học`,`quy hoạch lại mạng lưới cơ sở giáo dục nghề nghiệp, giáo dục đại học gắn với quy hoạch phát triển kinh tế - xã hội và phát triển nguồn nhân lực.`,`thắt chặt đầu tư cho phát triển nguồn nhân lực đặc biệt là đầu tư cho lĩnh vực giáo dục- đào tạo.`,`tổ chức nghiên cứu khoa học và đào tạo phải thay đổi cơ bản phương thức hoạt động, tách rời giữa nghiên cứu, đào tạo với doanh nghiệp.`],answer:1,explanation:``,tags:[`Trắc nghiệm lý thuyết`,`Nhận biết`,`Câu 49`,`ID 231291264`]},{id:`c6-231291265`,chapterId:`c6`,chapterTitle:`CHƯƠNG 6: CÔNG NGHIỆP HÓA, HIỆN ĐẠI HÓA VÀ HỘI NHẬP KINH TẾ QUỐC TẾ CỦA VIỆT NAM`,sourceId:`231291265`,sourceQuestionNumber:50,type:`Nhận diện bẫy`,difficulty:`Thông hiểu`,prompt:`Nội dung nào dưới đây không phải là giải pháp cơ bản nước ta cần thực hiện để nâng cao trình độ đào tạo, sử dụng nhân lực, nhân tài?`,options:[`Đổi mới mạnh mẽ và đồng bộ lĩnh vực giáo dục -dào tạo theo hương coi trọng chất lượng, hiệu quả và coi trọng phát triển phẩm chất, năng lực của nguòi học`,`Quy hoạch lại mạng lưới cơ sở giá
